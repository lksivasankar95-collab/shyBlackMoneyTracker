
name: Build ShyBlack Money Tracker APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "shyblack/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: shyblack/package-lock.json

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install dependencies
        working-directory: shyblack
        run: npm ci

      - name: Build web application
        working-directory: shyblack
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: shyblack
        run: npx cap sync android

      - name: Build debug APK
        working-directory: shyblack/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShyBlack-Money-Tracker-APK
          path: shyblack/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
