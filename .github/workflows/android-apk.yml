
name: Build ShyBlack Money Tracker Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "shyblack/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-release:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: shyblack/package-lock.json

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install dependencies
        working-directory: shyblack
        run: npm ci

      - name: Build web application
        working-directory: shyblack
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: shyblack
        run: npx cap sync android

      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > shyblack/android/app/release-key.jks

          cat > shyblack/android/keystore.properties <<EOF
          storeFile=release-key.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

          test -s shyblack/android/app/release-key.jks

      - name: Build release APK
        working-directory: shyblack/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verify release APK
        run: |
          test -s shyblack/android/app/build/outputs/apk/release/app-release.apk

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: ShyBlack-Money-Tracker-Release-APK
          path: shyblack/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing files
        if: always()
        run: |
          rm -f shyblack/android/app/release-key.jks
          rm -f shyblack/android/keystore.properties
